# golangci-lint 配置（v2 格式）。
# lint：golangci-lint run；格式化：golangci-lint fmt；检查格式：golangci-lint fmt --diff。
version: "2"

linters:
  # 官方 standard 集合：errcheck、govet、ineffassign、staticcheck、unused
  default: standard
  settings:
    errcheck:
      # 包级函数的惯例忽略
      exclude-functions:
        - os.Remove
        - fmt.Fprint
  exclusions:
    rules:
      # errcheck 惯例豁免：资源释放（Close）与事务回滚（Rollback）的错误不影响主流程。
      # 成功路径的写侧 Close（如 zip.Writer.Close）已在代码中显式检查错误。
      - linters:
          - errcheck
        text: "Error return value of `[^`]*\\.(Close|Rollback)` is not checked"

issues:
  # 不截断相同问题，避免漏报
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    # gofmt 的严格超集：统一 import 分组、空行与不可打印字符等
    - gofumpt
  settings:
    gofumpt:
      # 声明模块路径，保持「标准库一组、本项目一组」的既有 import 分组风格
      module-path: craftwork
