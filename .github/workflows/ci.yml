name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交会取消上一次未完成的检查，避免重复消耗运行时间。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 类型检查与单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # pnpm 版本读 package.json 的 packageManager 字段。
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

  build:
    name: 桌面构建冒烟
    runs-on: macos-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # postinstall 会执行 electron-builder install-app-deps，
      # 为 Electron ABI 原生构建 node-pty。
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # macOS runner 上产出 dist/mac-arm64/CraftWork.app；
      # 未配置签名与公证时 electron-builder 以可用身份签名或跳过。
      - name: 打包冒烟
        run: pnpm dist:dir

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: CraftWork-macos
          path: dist/mac-arm64/
          retention-days: 3
          if-no-files-found: error
