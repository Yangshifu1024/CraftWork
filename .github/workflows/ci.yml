name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交会取消上一次未完成的检查，避免重复消耗运行时间。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go 测试与静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 单元测试
        run: go test ./...

      - name: 静态检查
        run: go vet ./...

      - name: 安装 golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: golangci-lint
        run: golangci-lint run

      - name: 安装 govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: 检查 Go 依赖漏洞
        run: govulncheck ./...

  build:
    name: 桌面构建冒烟（mygo）
    runs-on: macos-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # mygo 是 go.mod 的 tool 依赖，`go tool mygo build` 直接可用；
      # macOS runner 上产出 .app 与 DMG（无 Developer ID 时以可用身份
      # 签名，未配置公证时自动跳过该步）。
      - name: mygo 构建
        run: go tool mygo build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: CraftWork-macos
          path: bin/
          retention-days: 3
          if-no-files-found: error
