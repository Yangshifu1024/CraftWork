name: CI

on:
  push:
    branches: [main, tauri-migration]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交会取消上一次未完成的检查，避免重复消耗运行时间。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 渲染层类型检查（领域内核由 rust job 覆盖）。
  check:
    name: 类型检查（web）
    runs-on: macos-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # pnpm 版本读 package.json 的 packageManager 字段。
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

  # Rust 侧（cargo workspace：src-tauri + crates/craft-*）。
  # 迁移期 macOS 必绿；ubuntu/windows 允许失败占位（docs/tauri-migration/issues/01）。
  rust:
    name: Rust 检查（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'macos-latest' }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings
