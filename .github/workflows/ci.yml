name: CI

on:
  push:
    branches: [main, tauri-migration]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交会取消上一次未完成的检查，避免重复消耗运行时间。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 渲染层类型检查（领域内核由 rust job 覆盖）。
  check:
    name: 类型检查（web）
    runs-on: macos-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # pnpm 版本读 package.json 的 packageManager 字段。
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

  # Rust 侧（cargo workspace：src-tauri + crates/craft-*）。
  # 三平台都必须全绿，run 才算通过（无占位放行）。
  rust:
    name: Rust 检查（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖（Tauri Linux 侧需要 webkit2gtk）
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # 与 rust-toolchain.toml 锁定版本一致，否则 clippy 组件装到别的工具链上
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings
