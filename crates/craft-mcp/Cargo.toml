[package]
name = "craft-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
craft-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# rmcp：MCP 官方 Rust SDK（协议编解码、initialize 握手、tools/list、tools/call）。
# 只开客户端所需特性：client（客户端服务）、transport-child-process（stdio 子进程）、
# transport-streamable-http-client-reqwest（streamable HTTP，自动兼容旧式 SSE）、
# reqwest（rustls TLS）。不开 server / auth / macros / schemars。
# 它依赖 reqwest 0.13.2，与 workspace 现有 reqwest 0.13 同一条，不引入第二棵依赖树。
rmcp = { workspace = true, features = [
    "base64",
    "client",
    "reqwest",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
tokio = { workspace = true, features = ["rt", "sync", "time", "process", "macros", "io-util"] }
tokio-util = { workspace = true, features = ["rt"] }
# reqwest：远程 MCP 的 HTTP 客户端由本 crate 自己构造（才能经 craft-core::network
# 应用用户代理设置，D14）；版本与 rmcp 依赖的同一条 0.13.2，不会产生第二个版本。
reqwest = { workspace = true, features = ["json", "stream", "rustls", "socks"] }
# process-wrap：stdio 子进程的独立进程组与整组终止（rmcp 的 child-process 传输
# 正是用它的 CommandWrap 接口，这里用同一个版本以免类型不兼容）。
process-wrap = { workspace = true, features = ["tokio1"] }

[dev-dependencies]
tempfile = { workspace = true }
