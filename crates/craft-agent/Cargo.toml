[package]
name = "craft-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
craft-core = { path = "../craft-core" }
craft-store = { path = "../craft-store" }
craft-policy = { path = "../craft-policy" }
craft-model = { path = "../craft-model" }
craft-tools = { path = "../craft-tools" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tokio-util = "0.7"
futures-core = "0.3"
futures-util = "0.3"
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
