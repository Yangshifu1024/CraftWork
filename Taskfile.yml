version: '3'

# 常用 Go 任务的快捷入口（需另装 go-task；等价命令可直接执行）。
# 桌面应用构建走 `go tool mygo build`（mygo 是 go.mod 的 tool 依赖，
# 不需要单独安装 CLI）。

tasks:
  build:
    summary: 构建桌面应用（.app + DMG，输出 bin/）
    cmds:
      - go tool mygo build

  models:sync:
    summary: 从 models.dev 同步并生成目录快照（internal/model/catalogdata）
    cmds:
      - go run ./cmd/modelsync

  models:check:
    summary: 检查目录快照是否与 models.dev 漂移
    cmds:
      - go run ./cmd/modelsync -check

  test:
    summary: Go 单元测试
    cmds:
      - go test ./...

  check:
    summary: Go 静态检查
    cmds:
      - go vet ./...
