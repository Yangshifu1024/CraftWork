# Electron 打包配置（electron-builder）。
# 版本事实源：package.json 的 version（与 internal/version 语义一致的单一事实源）。
appId: com.craftwork.app
productName: CraftWork
directories:
  output: dist
  buildResources: build
asar: true
files:
  - out/**
  - "package.json"
  - "!**/*.map"
mac:
  category: public.app-category.developer-tools
  icon: assets/logo.png
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  writeUpdateInfo: false
# Windows：nsis 安装包（node-pty 需在 Windows 上实机编译，交叉编译不可行）
win:
  icon: assets/logo.png
  target:
    - target: nsis
      arch:
        - x64
# Linux：AppImage（node-pty 需在 Linux 上实机编译）
linux:
  icon: assets/logo.png
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
