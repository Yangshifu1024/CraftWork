# Tauri 应用壳：入口、窗口、托盘、IPC 接线、capabilities。唯一的 Tauri API 使用方；
# 领域逻辑一律放在 crates/craft-* 中保持可独立测试（分层依据 docs/tauri-migration/plan.md §1.2）。
[package]
name = "craftwork"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "craftwork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }
craft-agent = { path = "../crates/craft-agent" }
craft-core = { path = "../crates/craft-core" }
craft-doc = { path = "../crates/craft-doc" }
craft-model = { path = "../crates/craft-model" }
craft-policy = { path = "../crates/craft-policy" }
craft-store = { path = "../crates/craft-store" }
craft-tools = { path = "../crates/craft-tools" }
