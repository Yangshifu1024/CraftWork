<div class="app" id="app">
  <!-- 主体三栏：左侧标题行与聊天头部、面板标签栏处于同一水平线 -->
  <div class="body">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <a class="brand" href="#" id="brand" aria-label="CraftWork 首页">
          <span class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
              <path d="M12 2.8 20.2 7.4v9.2L12 21.2 3.8 16.6V7.4z"/>
              <path d="M12 7.4l4.6 2.6v4.8L12 17.4l-4.6-2.6V10z" opacity=".5"/>
            </svg>
          </span>
          <span class="brand-text">CraftWork</span>
        </a>
      </div>
      <div class="mode-switch" id="mode-switch" role="tablist" aria-label="工作模式">
        <span class="mode-glider" aria-hidden="true"></span>
        <button type="button" class="mode-btn" data-mode="code" role="tab" aria-selected="true">
          <svg class="ico"><use href="#i-code"/></svg><span>Code</span>
        </button>
        <button type="button" class="mode-btn" data-mode="work" role="tab" aria-selected="false">
          <svg class="ico"><use href="#i-briefcase"/></svg><span>Work</span>
        </button>
      </div>
      <div class="ws-card" id="ws-card"></div>

      <div class="thread-head">
        <div class="thread-head-title">
          <span id="thread-section-label">Code 线程</span>
          <span class="count-chip" id="thread-count">0</span>
        </div>
        <div class="thread-head-actions">
          <button type="button" class="icon-btn sm" id="btn-thread-search" title="搜索线程" aria-label="搜索线程">
            <svg class="ico"><use href="#i-search"/></svg>
          </button>
          <button type="button" class="icon-btn sm" id="btn-new-thread" title="新建线程 ⌘N" aria-label="新建线程">
            <svg class="ico"><use href="#i-plus"/></svg>
          </button>
        </div>
      </div>

      <div class="thread-search" id="thread-search" hidden>
        <svg class="ico"><use href="#i-search"/></svg>
        <input id="thread-search-input" type="text" placeholder="搜索线程标题与内容…" autocomplete="off">
        <button type="button" class="icon-btn sm" id="btn-thread-search-close" aria-label="关闭搜索">
          <svg class="ico"><use href="#i-x"/></svg>
        </button>
      </div>

      <div class="thread-list" id="thread-list"></div>

      <div class="sidebar-foot">
        <div class="side-row">
          <button type="button" class="side-link" id="btn-usage">
            <svg class="ico"><use href="#i-zap"/></svg><span>用量</span><span class="side-value" id="foot-usage">0</span>
          </button>
          <button type="button" class="side-link" id="btn-audit">
            <svg class="ico"><use href="#i-shield-check"/></svg><span>审计</span><span class="side-value" id="foot-audit">0</span>
          </button>
        </div>
        <div class="side-row">
          <button type="button" class="side-link" id="btn-palette" title="命令面板 ⌘K">
            <svg class="ico"><use href="#i-command"/></svg><span>命令面板</span><span class="kbd">⌘K</span>
          </button>
          <button type="button" class="side-link" id="btn-settings" title="设置 ⌘,">
            <svg class="ico"><use href="#i-settings"/></svg><span>设置</span><span class="kbd">⌘,</span>
          </button>
        </div>
      </div>
    </aside>

    <section class="chat-pane">
      <div class="chat-head" id="chat-head"></div>
      <div class="chat-scroll" id="chat-scroll">
        <div class="chat-stream" id="chat-stream"></div>
        <button type="button" class="jump-bottom" id="jump-bottom" hidden>
          <svg class="ico"><use href="#i-arrow-down"/></svg><span>回到底部</span>
        </button>
      </div>
      <div class="composer-wrap">
        <div class="composer" id="composer">
          <div class="attach-strip" id="attach-strip" hidden></div>
          <div class="composer-input-row">
            <textarea id="composer-input" rows="1" placeholder="向 CraftWork 描述你的任务…" aria-label="消息输入框"></textarea>
          </div>
          <div class="composer-bar">
            <div class="composer-tools">
              <button type="button" class="icon-btn sm" id="btn-attach" title="添加附件" aria-label="添加附件">
                <svg class="ico"><use href="#i-paperclip"/></svg>
              </button>
              <button type="button" class="icon-btn sm" id="btn-image" title="添加图片" aria-label="添加图片">
                <svg class="ico"><use href="#i-image"/></svg>
              </button>
              <span class="composer-sep" aria-hidden="true"></span>
              <button type="button" class="composer-approval" id="composer-approval" aria-haspopup="menu" title="审批档位">
                <svg class="ico"><use href="#i-shield"/></svg>
                <span id="composer-approval-label">分级</span>
                <svg class="ico chev"><use href="#i-chevron-down"/></svg>
              </button>
            </div>
            <div class="composer-send">
              <span class="ctx-hint" id="ctx-hint"></span>
              <button type="button" class="composer-model" id="composer-model" aria-haspopup="menu" title="切换模型（只影响后续 run）">
                <span class="model-dot"></span>
                <span class="composer-model-name" id="composer-model-name">Claude Sonnet 4.5</span>
                <svg class="ico chev"><use href="#i-chevron-down"/></svg>
              </button>
              <button type="button" class="send-btn" id="btn-send" title="发送 ⌘↵" aria-label="发送">
                <svg class="ico"><use href="#i-arrow-up"/></svg>
              </button>
              <button type="button" class="stop-btn" id="btn-stop" title="停止生成 Esc" aria-label="停止生成" hidden>
                <svg class="ico"><use href="#i-stop"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="composer-foot" id="composer-foot"></div>
      </div>
    </section>

    <aside class="panel" id="panel">
      <div class="panel-resize" id="panel-resize" role="separator" aria-orientation="vertical" aria-label="调整面板宽度"></div>
      <div class="panel-tabs" id="panel-tabs" role="tablist"></div>
      <div class="panel-body" id="panel-body"></div>
    </aside>
  </div>

  <!-- 状态栏 -->
  <footer class="statusbar" id="statusbar"></footer>
</div>

<div class="popover-layer" id="popover-layer"></div>
<div class="overlay-layer" id="overlay-layer"></div>
<div class="toast-layer" id="toast-layer" aria-live="polite"></div>

<script src="js/data.js?v=16"></script>
<script src="js/markdown.js?v=16"></script>
<script src="js/core.js?v=16"></script>
<script src="js/chat.js?v=16"></script>
<script src="js/panel-files.js?v=16"></script>
<script src="js/panel-diff.js?v=16"></script>
<script src="js/panel-terminal.js?v=16"></script>
<script src="js/panel-document.js?v=16"></script>
<script src="js/overlays.js?v=16"></script>
<script src="js/scenarios.js?v=16"></script>
<script src="js/app.js?v=16"></script>
</body>
</html>
